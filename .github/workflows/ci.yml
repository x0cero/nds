name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 headers (minifb build dependencies)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libwayland-cursor0 libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: CPU test suite (armwrestler)
        run: NDS_FRAMES=120 ./target/release/nds tests/armwrestler.nds
